name: Build and Upload JAR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Project
        run: ./mvnw package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-jar
          path: target/*.jar
